name: Deploy Dashboard

# Este workflow só publica o conteúdo de public/ no GitHub Pages.
# A atualização dos dados (public/data.json) é feita por uma rotina agendada
# do Claude (usando o conector do Notion) que faz commit + push direto para main.
# Se um dia você tiver um NOTION_TOKEN (integração do Notion com permissão de
# criar conexões), dá pra voltar a gerar os dados aqui mesmo — ver README.md.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
